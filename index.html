<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binomial Drill</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&display=swap">
<style>
  :root {
    --ground: #F5F6F0;
    --paper: #FFFFFF;
    --ink: #1F261C;
    --ink-2: #5E6B58;
    --line: #D9DDD1;
    --moss: #3E5C3A;
    --moss-ink: #FFFFFF;
    --moss-soft: #E6EDE1;
    --ok: #2E7D4F;
    --ok-soft: #DDF1E3;
    --bad: #B3402F;
    --bad-soft: #F8E1DC;
    --kb-bg: #D1D4D9;
    --kb-key: #FFFFFF;
    --kb-key-ink: #000000;
    --kb-key-dark: #ABB0BA;
    --kb-shadow: #898A8D;
    --kb-return: #3E5C3A;
    --kb-return-ink: #FFFFFF;
    --overlay: rgba(31, 38, 28, 0.45);
    --serif: "Fraunces", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #151A14;
      --paper: #1E2520;
      --ink: #E7EBE1;
      --ink-2: #9AA894;
      --line: #313B2F;
      --moss: #8DB07F;
      --moss-ink: #10160F;
      --moss-soft: #263323;
      --ok: #6FC48F;
      --ok-soft: #1E3A2A;
      --bad: #E4806E;
      --bad-soft: #43241F;
      --kb-bg: #2B2B2D;
      --kb-key: #6B6B6E;
      --kb-key-ink: #FFFFFF;
      --kb-key-dark: #464649;
      --kb-shadow: #1A1A1B;
      --kb-return: #8DB07F;
      --kb-return-ink: #10160F;
      --overlay: rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --ground: #151A14;
    --paper: #1E2520;
    --ink: #E7EBE1;
    --ink-2: #9AA894;
    --line: #313B2F;
    --moss: #8DB07F;
    --moss-ink: #10160F;
    --moss-soft: #263323;
    --ok: #6FC48F;
    --ok-soft: #1E3A2A;
    --bad: #E4806E;
    --bad-soft: #43241F;
    --kb-bg: #2B2B2D;
    --kb-key: #6B6B6E;
    --kb-key-ink: #FFFFFF;
    --kb-key-dark: #464649;
    --kb-shadow: #1A1A1B;
    --kb-return: #8DB07F;
    --kb-return-ink: #10160F;
    --overlay: rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }

  /* ---------- top bar ---------- */
  .top {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 8px;
  }
  .top .deck-btn {
    border: 0; background: transparent; padding: 6px 0;
    color: var(--moss); font-weight: 600; font-size: 15px; cursor: pointer;
    white-space: nowrap;
  }
  .seg {
    margin-left: auto;
    display: inline-flex;
    background: var(--line);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    border: 0; background: transparent; border-radius: 7px;
    padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2);
    cursor: pointer; touch-action: manipulation;
  }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  .meta {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px 6px;
    font-size: 12px; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em; text-transform: uppercase;
  }
  .meta .score { display: inline-flex; gap: 10px; }
  .meta .score .ok { color: var(--ok); }
  .meta .score .bad { color: var(--bad); }

  /* ---------- stage ---------- */
  main {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 16px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 20px 20px;
    max-width: 560px;
    margin: 0 auto;
    display: flex; flex-direction: column; gap: 14px;
    min-height: 100%;
  }
  .eyebrow {
    margin: 0;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-2);
  }
  .common {
    margin: 0;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(26px, 6.5vw, 34px);
    line-height: 1.1;
    text-wrap: balance;
  }
  .photo-wrap { display: flex; flex-direction: column; gap: 6px; }
  .photo {
    display: block; width: 100%; max-width: 100%;
    aspect-ratio: 16 / 9; max-height: 22vh; object-fit: cover;
    border-radius: 12px; background: var(--moss-soft); cursor: zoom-in;
  }
  .lightbox {
    position: fixed; inset: 0; z-index: 30; background: var(--overlay);
    display: flex; align-items: center; justify-content: center; padding: 16px;
    cursor: zoom-out;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; object-fit: contain; }
  .thumbs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .thumbs img {
    flex: 0 0 auto; width: 40px; height: 40px; object-fit: cover;
    border-radius: 6px; border: 2px solid transparent; cursor: pointer;
    background: var(--moss-soft);
  }
  .thumbs img[aria-current="true"] { border-color: var(--moss); }
  .credit { font-size: 11px; color: var(--ink-2); }
  .credit a { color: inherit; }
  .hint { margin: 0; font-size: 14px; color: var(--ink-2); }

  .answer {
    display: flex; flex-wrap: wrap; align-items: flex-end;
    gap: 6px 18px;
    padding: 6px 0 2px;
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(24px, 6vw, 30px);
    min-height: 54px;
  }
  .word { display: inline-flex; gap: 3px; }
  .cell {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.05em; height: 1.4em;
    border-bottom: 2px solid transparent;
    border-radius: 3px;
    line-height: 1;
    position: relative;
  }
  .cell.fixed { color: var(--ink); }
  .cell.fixed.punct { width: .6em; color: var(--ink-2); }
  .cell.blank {
    color: var(--ink-2);
    border-bottom-color: var(--line);
    background: var(--moss-soft);
    cursor: pointer;
  }
  .cell.blank.filled { color: var(--ink); }
  .cell.blank.active { border-bottom-color: var(--moss); }
  .cell.blank.active::after {
    content: ""; position: absolute; left: 50%; bottom: -2px;
    width: 60%; height: 2px; transform: translateX(-50%);
    background: var(--moss);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .checked .cell.blank.active::after { display: none; }
  .cell.blank.ok { background: var(--ok-soft); color: var(--ok); border-bottom-color: var(--ok); }
  .cell.blank.bad { background: var(--bad-soft); color: var(--bad); border-bottom-color: var(--bad); }
  .cell.blank.bad .fix {
    position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    font-size: .5em; font-style: normal; color: var(--ok); margin-top: 3px;
  }

  .typed {
    min-height: 1.4em; padding: 2px 0;
    border-bottom: 2px solid var(--line);
    flex: 1 1 100%;
    display: flex; align-items: center;
    white-space: pre; overflow-x: auto;
  }
  .typed.empty::before { content: attr(data-placeholder); color: var(--ink-2); opacity: .7; font-size: .7em; font-style: normal; }
  .typed .caret {
    display: inline-block; width: 2px; height: 1.1em; background: var(--moss);
    margin-left: 1px; vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  .checked .typed .caret { display: none; }
  .typed.ok { color: var(--ok); border-bottom-color: var(--ok); }
  .typed.bad { color: var(--bad); border-bottom-color: var(--bad); }

  .feedback {
    min-height: 24px;
    font-size: 15px;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
  }
  .feedback .verdict { font-weight: 600; }
  .feedback.ok .verdict { color: var(--ok); }
  .feedback.bad .verdict { color: var(--bad); }
  .feedback .full { font-family: var(--serif); font-style: italic; font-size: 18px; }
  .feedback .note { color: var(--ink-2); font-size: 13px; flex: 1 1 100%; }

  .card-actions { margin-top: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: 1px solid var(--line); background: var(--paper);
    border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
  }
  .btn.primary { background: var(--moss); color: var(--moss-ink); border-color: var(--moss); }
  .btn.quiet { color: var(--ink-2); }

  /* summary */
  .summary { text-align: left; }
  .summary h2 { font-family: var(--serif); font-weight: 600; font-size: 28px; margin: 0; }
  .summary .big { font-family: var(--serif); font-size: 48px; font-weight: 600; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .summary ul { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; }
  .summary li em { font-family: var(--serif); color: var(--ink); font-size: 16px; }

  /* ---------- keyboard ---------- */
  .kb {
    flex: 0 0 auto;
    background: var(--kb-bg);
    padding: 8px 3px calc(8px + env(safe-area-inset-bottom, 0px));
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  .kb .row {
    display: flex; justify-content: center; gap: 6px;
    margin: 0 auto 10px; max-width: 560px;
  }
  .kb .row:last-child { margin-bottom: 0; }
  .kb .key {
    flex: 1 1 0;
    max-width: 48px;
    height: 44px;
    border: 0; border-radius: 6px;
    background: var(--kb-key); color: var(--kb-key-ink);
    box-shadow: 0 1px 0 var(--kb-shadow);
    font-family: var(--sans); font-size: 22px; font-weight: 400;
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .kb .row.mid { padding: 0 24px; }
  .kb .key.wide { flex: 1.5 1 0; max-width: 72px; background: var(--kb-key-dark); font-size: 17px; }
  .kb .key.wide.shift[aria-pressed="true"] { background: var(--kb-key); }
  .kb .key.space { flex: 5 1 0; max-width: none; font-size: 16px; }
  .kb .key.dash { flex: 1.3 1 0; max-width: 64px; background: var(--kb-key-dark); font-size: 20px; }
  .kb .key.ret { flex: 2.2 1 0; max-width: 110px; background: var(--kb-return); color: var(--kb-return-ink); font-size: 16px; font-weight: 600; }
  .kb .key.ret.next { background: var(--moss); color: var(--moss-ink); }
  .kb .key.letter:active { background: var(--kb-key-dark); }
  .kb .key.letter:active::after {
    content: attr(data-key);
    position: absolute; left: 50%; bottom: 100%;
    transform: translate(-50%, -2px);
    min-width: 46px; height: 54px; padding: 0 8px;
    border-radius: 8px 8px 8px 8px;
    background: var(--kb-key); color: var(--kb-key-ink);
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    font-size: 32px; display: flex; align-items: center; justify-content: center;
    z-index: 5;
  }
  .kb .key.wide:active, .kb .key.dash:active, .kb .key.space:active { filter: brightness(.9); }
  .kb[data-shift="on"] .key.letter { text-transform: uppercase; }
  .kb .key svg { width: 22px; height: 22px; fill: currentColor; }

  /* ---------- deck sheet ---------- */
  .sheet-wrap {
    position: fixed; inset: 0; z-index: 20;
    background: var(--overlay);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--paper); color: var(--ink);
    width: 100%; max-width: 640px;
    border-radius: 18px 18px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    max-height: 88%;
    display: flex; flex-direction: column; gap: 10px;
  }
  .sheet h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 22px; }
  .sheet p { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
  .sheet code { font-size: 12px; background: var(--moss-soft); padding: 1px 5px; border-radius: 4px; }
  .sheet textarea {
    flex: 1 1 auto; min-height: 180px;
    width: 100%; resize: vertical;
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink); background: var(--ground);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  }
  .sheet .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sheet .row .btn { padding: 9px 12px; }
  .sheet .row .spacer { flex: 1; }
  .sheet .err { color: var(--bad); font-size: 13px; }

  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-5px);} 40%, 80% { transform: translateX(5px);} }
  @media (prefers-reduced-motion: reduce) {
    .cell.blank.active::after, .typed .caret { animation: none; }
    .shake { animation: none; }
  }
  @media (max-width: 380px) {
    .kb .key { height: 40px; font-size: 20px; }
    .kb .row { gap: 4px; }
  }
</style>

<header class="top">
  <button class="deck-btn" id="deckBtn" type="button">Deck ▾</button>
  <div class="seg" role="group" aria-label="Difficulty">
    <button type="button" id="lvl-easy" data-level="easy" aria-pressed="true">Easy</button>
    <button type="button" id="lvl-medium" data-level="medium" aria-pressed="false">Medium</button>
    <button type="button" id="lvl-hard" data-level="hard" aria-pressed="false">Hard</button>
  </div>
</header>
<div class="meta">
  <span id="progress">Card 1 of 32</span>
  <span class="score"><span class="ok" id="okCount">0 right</span><span class="bad" id="badCount">0 wrong</span></span>
</div>

<main>
  <section class="card" id="card" aria-live="polite"></section>
</main>

<div class="kb" id="kb" data-shift="off" aria-label="On-screen keyboard"></div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Your deck</h2>
    <p>One plant per line: <code>Genus species | Common name | Family</code>. Family is optional. Add a fourth field with an image URL to show a photo. Edits are kept on this device.</p>
    <textarea id="deckText" spellcheck="false"></textarea>
    <div class="err" id="deckErr"></div>
    <div class="row">
      <button class="btn quiet" type="button" id="resetDeck">Restore sample deck</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="cancelDeck">Cancel</button>
      <button class="btn primary" type="button" id="saveDeck">Save &amp; restart</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------
  // Sample deck (common UK plants). Replace via the Deck button in-app.
  // ------------------------------------------------------------------
  var SAMPLE = [
    'Quercus robur | Pedunculate oak | Fagaceae',
    'Fagus sylvatica | Beech | Fagaceae',
    'Betula pendula | Silver birch | Betulaceae',
    'Alnus glutinosa | Alder | Betulaceae',
    'Corylus avellana | Hazel | Betulaceae',
    'Fraxinus excelsior | Ash | Oleaceae',
    'Acer pseudoplatanus | Sycamore | Sapindaceae',
    'Ilex aquifolium | Holly | Aquifoliaceae',
    'Taxus baccata | Yew | Taxaceae',
    'Crataegus monogyna | Hawthorn | Rosaceae',
    'Prunus spinosa | Blackthorn | Rosaceae',
    'Rubus fruticosus | Bramble | Rosaceae',
    'Sambucus nigra | Elder | Adoxaceae',
    'Hedera helix | Ivy | Araliaceae',
    'Urtica dioica | Stinging nettle | Urticaceae',
    'Bellis perennis | Daisy | Asteraceae',
    'Taraxacum officinale | Dandelion | Asteraceae',
    'Achillea millefolium | Yarrow | Asteraceae',
    'Ranunculus repens | Creeping buttercup | Ranunculaceae',
    'Plantago lanceolata | Ribwort plantain | Plantaginaceae',
    'Digitalis purpurea | Foxglove | Plantaginaceae',
    'Trifolium repens | White clover | Fabaceae',
    'Hyacinthoides non-scripta | Bluebell | Asparagaceae',
    'Primula vulgaris | Primrose | Primulaceae',
    'Galium aparine | Cleavers | Rubiaceae',
    'Lamium album | White dead-nettle | Lamiaceae',
    'Heracleum sphondylium | Hogweed | Apiaceae',
    'Anthriscus sylvestris | Cow parsley | Apiaceae',
    'Silene dioica | Red campion | Caryophyllaceae',
    'Geranium robertianum | Herb Robert | Geraniaceae',
    'Pteridium aquilinum | Bracken | Dennstaedtiaceae',
    'Calluna vulgaris | Heather | Ericaceae'
  ].join('\n');

  var STORE_DECK = 'binomial-drill.deck.v1';
  var STORE_LEVEL = 'binomial-drill.level.v1';

  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function save(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* ignore */ } }
  function remove(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } }

  // ------------------------------------------------------------------
  // Deck parsing
  // ------------------------------------------------------------------
  function parseDeck(text) {
    var cards = [], errors = [];
    text.split(/\r?\n/).forEach(function (raw, n) {
      var line = raw.trim();
      if (!line || line.charAt(0) === '#') return;
      var parts = line.split(/\s*(?:\||;|\t| - | – )\s*/);
      var name = parts[0].trim().split(/\s+/);
      if (name.length < 2) { errors.push('Line ' + (n + 1) + ': needs "Genus species"'); return; }
      var genus = name[0], species = name.slice(1).join(' ');
      if (!/^[A-Za-z][A-Za-z-]*$/.test(genus) || !/^[A-Za-z][A-Za-z-]*(?: [A-Za-z][A-Za-z-]*)*$/.test(species)) {
        errors.push('Line ' + (n + 1) + ': "' + parts[0] + '" has characters other than letters and hyphens');
        return;
      }
      cards.push({
        genus: genus.charAt(0).toUpperCase() + genus.slice(1).toLowerCase(),
        species: species.toLowerCase(),
        common: (parts[1] || '').trim(),
        family: (parts[2] || '').trim(),
        image: (parts[3] || '').trim()
      });
    });
    return { cards: cards, errors: errors };
  }

  // ------------------------------------------------------------------
  // State
  // ------------------------------------------------------------------
  var state = {
    level: 'easy',
    deckText: SAMPLE,
    deck: [],
    queue: [],
    total: 0,
    current: null,
    words: [],      // [{text, cells:[{ch, blank, val, letter}]}]
    blanks: [],     // flattened blank cells in order
    cursor: 0,
    typed: '',
    checked: false,
    lastCorrect: false,
    firstTry: {},   // key -> true/false (first attempt result)
    ok: 0, bad: 0,
    missed: [],     // cards answered wrong at least once
    shift: false,
    done: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var cardEl = $('card'), kbEl = $('kb');

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function key(card) { return card.genus + ' ' + card.species; }

  // ------------------------------------------------------------------
  // Round lifecycle
  // ------------------------------------------------------------------
  function startRound() {
    var parsed = parseDeck(state.deckText);
    state.deck = parsed.cards;
    state.queue = shuffle(state.deck.slice());
    state.total = state.deck.length;
    state.ok = 0; state.bad = 0; state.firstTry = {}; state.missed = [];
    state.done = false;
    nextCard();
  }

  function nextCard() {
    state.checked = false; state.typed = ''; state.cursor = 0;
    cardEl.classList.remove('checked');
    if (!state.queue.length) { state.done = true; state.current = null; renderSummary(); renderKeyboard(); updateMeta(); return; }
    state.current = state.queue.shift();
    buildBlanks();
    renderCard();
    renderKeyboard();
    updateMeta();
  }

  function buildBlanks() {
    var c = state.current;
    var words = [{ text: c.genus, role: 'genus' }];
    c.species.split(' ').forEach(function (w) { words.push({ text: w, role: 'species' }); });
    var hideRole = null;
    if (state.level === 'medium') hideRole = Math.random() < 0.5 ? 'genus' : 'species';

    state.words = words.map(function (w) {
      var letters = [];
      var cells = Array.prototype.map.call(w.text, function (ch, i) {
        var isLetter = /[a-z]/i.test(ch);
        if (isLetter) letters.push(i);
        return { ch: ch, letter: isLetter, blank: false, val: '' };
      });
      var toBlank = [];
      if (state.level === 'easy') {
        // Blank ~40% of the letters, at least one, never every letter. Re-rolled every time.
        var n = Math.max(1, Math.min(letters.length - 1, Math.round(letters.length * 0.4)));
        toBlank = shuffle(letters.slice()).slice(0, n);
      } else if (state.level === 'medium' && w.role === hideRole) {
        toBlank = letters;
      }
      toBlank.forEach(function (i) { cells[i].blank = true; });
      return { text: w.text, role: w.role, cells: cells };
    });
    state.blanks = [];
    state.words.forEach(function (w) { w.cells.forEach(function (cell) { if (cell.blank) state.blanks.push(cell); }); });
  }

  // ------------------------------------------------------------------
  // Rendering
  // ------------------------------------------------------------------
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function hintText() {
    if (state.level === 'easy') return 'Fill in the missing letters. Each dash is one letter.';
    if (state.level === 'medium') {
      var hidden = state.words.some(function (w) { return w.role === 'genus' && w.cells.some(function (c) { return c.blank; }); }) ? 'genus' : 'species';
      return 'Type the missing ' + hidden + '. Each dash is one letter.';
    }
    return 'Type the full name: genus, a space, then species.';
  }

  function renderCard() {
    var c = state.current;
    cardEl.innerHTML = '';
    cardEl.appendChild(el('p', 'eyebrow', c.family || 'Plant'));
    var pw = el('div', 'photo-wrap'); pw.hidden = true;
    var img = el('img', 'photo'); img.alt = c.common || key(c);
    img.addEventListener('click', function () {
      var lb = el('div', 'lightbox'); var big = el('img'); big.src = img.src; big.alt = img.alt;
      lb.appendChild(big); lb.addEventListener('click', function () { lb.remove(); });
      document.body.appendChild(lb);
    });
    var thumbs = el('div', 'thumbs');
    var credit = el('div', 'credit');
    pw.appendChild(img); pw.appendChild(thumbs); pw.appendChild(credit);
    cardEl.appendChild(pw);
    loadPhotos(c, pw, img, thumbs, credit);
    cardEl.appendChild(el('h1', 'common', c.common || '(no common name given)'));
    cardEl.appendChild(el('p', 'hint', hintText()));

    var ans = el('div', 'answer'); ans.id = 'answer';
    if (state.level === 'hard') {
      var typed = el('div', 'typed'); typed.id = 'typed';
      typed.setAttribute('data-placeholder', 'Type the full name');
      ans.appendChild(typed);
    } else {
      state.words.forEach(function (w) {
        var wEl = el('span', 'word');
        w.cells.forEach(function (cell) {
          var s;
          if (cell.blank) {
            s = el('span', 'cell blank');
            s.addEventListener('click', function () {
              if (state.checked) return;
              state.cursor = state.blanks.indexOf(cell);
              paintCells();
            });
            cell.el = s;
          } else {
            s = el('span', 'cell fixed' + (cell.letter ? '' : ' punct'), cell.ch);
          }
          wEl.appendChild(s);
        });
        ans.appendChild(wEl);
      });
    }
    cardEl.appendChild(ans);
    var fb = el('div', 'feedback'); fb.id = 'feedback';
    cardEl.appendChild(fb);

    var actions = el('div', 'card-actions');
    var skip = el('button', 'btn quiet', 'Reveal'); skip.type = 'button'; skip.id = 'revealBtn';
    skip.addEventListener('click', function () { if (!state.checked) reveal(); });
    actions.appendChild(skip);
    cardEl.appendChild(actions);

    paintCells();
  }

  // ------------------------------------------------------------------
  // Photos. Order tried: URL given in the deck, then photos/<genus>-<species>.jpg
  // next to this file (see tools/fetch_photos.py), then the images on the
  // species' Wikipedia article, fetched live and cached on this device.
  // ------------------------------------------------------------------
  var photoToken = 0;
  var WIKI_MEDIA = 'https://en.wikipedia.org/api/rest_v1/page/media-list/';

  function slug(c) { return (c.genus + '-' + c.species).toLowerCase().replace(/[^a-z]+/g, '-'); }

  function loadPhotos(c, wrap, img, thumbs, credit) {
    var token = ++photoToken;
    var candidates = [];
    if (c.image) candidates.push(c.image);
    candidates.push('photos/' + slug(c) + '.jpg');
    tryLocal();

    function tryLocal() {
      if (token !== photoToken) return;
      var src = candidates.shift();
      if (!src) { fromWikipedia(); return; }
      var probe = new Image();
      probe.onload = function () { show([{ src: src, page: null }]); };
      probe.onerror = tryLocal;
      probe.src = src;
    }

    function fromWikipedia() {
      var cacheKey = 'binomial-drill.photos.' + key(c);
      var cached = load(cacheKey);
      if (cached) {
        try { var arr = JSON.parse(cached); if (arr.length) { show(arr); return; } } catch (e) { /* refetch */ }
      }
      if (typeof fetch !== 'function') return;
      var title = encodeURIComponent(key(c).replace(/ /g, '_'));
      fetch(WIKI_MEDIA + title)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || token !== photoToken) return;
          var items = (d.items || []).filter(function (it) {
            if (it.type !== 'image' || !it.srcset || !it.srcset.length) return false;
            var t = it.title || '';
            if (/\.(svg|gif|png)$/i.test(t)) return false;
            if (/map|status|icon|logo|distribution|range|commons|wiki|question|edit|symbol/i.test(t)) return false;
            return true;
          });
          items.sort(function (a, b) { return (b.leadImage ? 1 : 0) - (a.leadImage ? 1 : 0); });
          items = items.slice(0, 5).map(function (it) {
            var src = it.srcset[0].src;
            if (src.indexOf('//') === 0) src = 'https:' + src;
            src = src.replace(/\/\d+px-/, '/640px-');
            return { src: src, page: 'https://commons.wikimedia.org/wiki/' + encodeURIComponent(it.title) };
          });
          if (!items.length) return;
          save(cacheKey, JSON.stringify(items));
          show(items);
        })
        .catch(function () { /* offline or blocked: card simply has no photo */ });
    }

    function show(list) {
      if (token !== photoToken) return;
      var current = 0;
      thumbs.innerHTML = '';
      if (list.length > 1) {
        list.forEach(function (it, n) {
          var t = el('img'); t.src = it.src; t.alt = ''; t.loading = 'lazy';
          t.addEventListener('click', function () { pick(n); });
          thumbs.appendChild(t);
        });
      }
      img.onload = function () { if (token === photoToken) wrap.hidden = false; };
      img.onerror = function () { if (current + 1 < list.length) pick(current + 1); };
      pick(0);

      function pick(n) {
        current = n;
        img.src = list[n].src;
        credit.innerHTML = '';
        if (list[n].page) {
          var a = el('a', null, 'Photo: Wikimedia Commons');
          a.href = list[n].page; a.target = '_blank'; a.rel = 'noopener';
          credit.appendChild(a);
        }
        Array.prototype.forEach.call(thumbs.children, function (t, k) {
          t.setAttribute('aria-current', k === n ? 'true' : 'false');
        });
      }
    }
  }

  function paintCells() {
    if (state.level === 'hard') {
      var t = $('typed'); if (!t) return;
      t.innerHTML = '';
      t.classList.toggle('empty', !state.typed);
      t.appendChild(document.createTextNode(state.typed));
      t.appendChild(el('span', 'caret'));
      return;
    }
    state.blanks.forEach(function (cell, i) {
      var s = cell.el;
      s.textContent = cell.val ? cell.val : '-';
      s.classList.toggle('filled', !!cell.val);
      s.classList.toggle('active', !state.checked && i === Math.min(state.cursor, state.blanks.length - 1));
    });
  }


  function updateMeta() {
    var left = state.queue.length + (state.current && !state.checked ? 1 : 0);
    $('progress').textContent = state.done
      ? 'Round complete'
      : left + ' left · ' + state.total + ' species';
    $('okCount').textContent = state.ok + ' right';
    $('badCount').textContent = state.bad + ' wrong';
  }

  function renderSummary() {
    cardEl.innerHTML = '';
    var wrap = el('div', 'summary');
    wrap.appendChild(el('p', 'eyebrow', state.level + ' · ' + state.total + ' species'));
    wrap.appendChild(el('h2', null, 'Round complete'));
    var firstTryOk = Object.keys(state.firstTry).filter(function (k) { return state.firstTry[k]; }).length;
    wrap.appendChild(el('div', 'big', firstTryOk + ' / ' + state.total));
    wrap.appendChild(el('p', 'hint', 'right first time. Every card was answered correctly before the round ended.'));
    if (state.missed.length) {
      var h = el('p', 'hint', 'Worth another look:'); h.style.marginTop = '10px';
      wrap.appendChild(h);
      var ul = el('ul');
      state.missed.forEach(function (c) {
        var li = el('li');
        var em = el('em', null, key(c));
        li.appendChild(em);
        if (c.common) li.appendChild(document.createTextNode(' · ' + c.common));
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
    }
    cardEl.appendChild(wrap);
    var actions = el('div', 'card-actions');
    var again = el('button', 'btn primary', 'Run again'); again.type = 'button';
    again.addEventListener('click', startRound);
    actions.appendChild(again);
    if (state.missed.length) {
      var onlyMissed = el('button', 'btn', 'Retry missed only'); onlyMissed.type = 'button';
      onlyMissed.addEventListener('click', function () {
        var missed = state.missed.slice();
        startRound();
        state.queue = shuffle(missed.slice());
        state.total = missed.length;
        nextCard();
      });
      actions.appendChild(onlyMissed);
    }
    cardEl.appendChild(actions);
  }

  // ------------------------------------------------------------------
  // Input handling
  // ------------------------------------------------------------------
  function typeChar(ch) {
    if (state.checked || state.done || !state.current) return;
    if (state.level === 'hard') {
      if (state.typed.length >= 60) return;
      if (ch === ' ' && (state.typed === '' || state.typed.slice(-1) === ' ')) return;
      state.typed += ch;
      paintCells();
      return;
    }
    if (ch === ' ') return;
    if (!/[a-z]/i.test(ch)) return;
    if (state.cursor >= state.blanks.length) return;
    var cell = state.blanks[state.cursor];
    var wordRole = null;
    state.words.forEach(function (w) { if (w.cells.indexOf(cell) >= 0) wordRole = w; });
    var isFirstOfGenus = wordRole && wordRole.role === 'genus' && wordRole.cells.indexOf(cell) === 0;
    cell.val = isFirstOfGenus ? ch.toUpperCase() : ch.toLowerCase();
    state.cursor++;
    paintCells();
  }

  function backspace() {
    if (state.checked || state.done || !state.current) return;
    if (state.level === 'hard') {
      state.typed = state.typed.slice(0, -1);
      paintCells();
      return;
    }
    if (state.cursor > 0) {
      state.cursor--;
      state.blanks[state.cursor].val = '';
      paintCells();
    }
  }

  function submit() {
    if (state.done || !state.current) return;
    if (state.checked) { nextCard(); return; }
    check();
  }

  function normalise(s) { return s.trim().replace(/\s+/g, ' ').toLowerCase(); }

  function check() {
    var c = state.current, correct;
    var fb = $('feedback');
    if (state.level === 'hard') {
      if (!state.typed.trim()) { nudge(); return; }
      correct = normalise(state.typed) === normalise(key(c));
      var t = $('typed');
      t.classList.add(correct ? 'ok' : 'bad');
    } else {
      var unfilled = state.blanks.some(function (cell) { return !cell.val; });
      if (unfilled) { nudge(); return; }
      correct = true;
      state.blanks.forEach(function (cell) {
        var good = cell.val.toLowerCase() === cell.ch.toLowerCase();
        if (!good) correct = false;
        cell.el.classList.add(good ? 'ok' : 'bad');
        if (!good) cell.el.appendChild(el('span', 'fix', cell.ch));
      });
    }
    finish(correct, false);
  }

  function reveal() {
    var c = state.current;
    if (state.level === 'hard') {
      state.typed = key(c); paintCells(); $('typed').classList.add('bad');
    } else {
      state.blanks.forEach(function (cell) { cell.val = cell.ch; cell.el.textContent = cell.ch; cell.el.classList.add('bad'); });
    }
    finish(false, true);
  }

  function finish(correct, revealed) {
    var c = state.current, fb = $('feedback');
    state.checked = true; state.lastCorrect = correct;
    cardEl.classList.add('checked');
    var k = key(c);
    if (!(k in state.firstTry)) state.firstTry[k] = correct;
    if (correct) state.ok++; else state.bad++;
    if (!correct) {
      if (state.missed.indexOf(c) < 0) state.missed.push(c);
      // Put the card back a few places down the queue so it comes round again.
      var at = Math.min(state.queue.length, 3);
      state.queue.splice(at, 0, c);
    }
    fb.className = 'feedback ' + (correct ? 'ok' : 'bad');
    fb.innerHTML = '';
    fb.appendChild(el('span', 'verdict', correct ? 'Correct' : (revealed ? 'Revealed' : 'Not quite')));
    fb.appendChild(el('span', 'full', k));
    fb.appendChild(el('span', 'note', correct ? 'Press Next to continue.' : 'This card will come round again shortly.'));
    var rb = $('revealBtn'); if (rb) rb.hidden = true;
    var nextBtn = el('button', 'btn primary', 'Next'); nextBtn.type = 'button';
    nextBtn.addEventListener('click', nextCard);
    cardEl.querySelector('.card-actions').appendChild(nextBtn);
    renderKeyboard();
    updateMeta();
  }

  function nudge() {
    var a = $('answer');
    a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
    var fb = $('feedback');
    fb.className = 'feedback';
    fb.innerHTML = '';
    fb.appendChild(el('span', 'note', state.level === 'hard' ? 'Type the name first.' : 'Fill every dash first.'));
  }

  // ------------------------------------------------------------------
  // Keyboard
  // ------------------------------------------------------------------
  var ROWS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  var SHIFT_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 12h5v8h8v-8h5z"/></svg>';
  var SHIFT_SVG_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 12h5v8h8v-8h5z" fill="currentColor"/><path d="M12 5.6 5.4 12H10v6h4v-6h4.6z" fill="#fff"/></svg>';
  var DEL_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5h11A2.5 2.5 0 0 1 22 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11L2 12zm2.6 3.3-1.4 1.4L12 12l-2.3 2.3 1.4 1.4L13.4 13.4l2.3 2.3 1.4-1.4L14.8 12l2.3-2.3-1.4-1.4-2.3 2.3z"/></svg>';

  function renderKeyboard() {
    kbEl.innerHTML = '';
    ROWS.forEach(function (row, r) {
      var rowEl = el('div', 'row' + (r === 1 ? ' mid' : ''));
      if (r === 2) rowEl.appendChild(makeKey('shift', 'wide shift', state.shift ? SHIFT_SVG_ON : SHIFT_SVG));
      row.split('').forEach(function (ch) {
        var k = makeKey(ch, 'letter', null);
        k.setAttribute('data-key', state.shift ? ch.toUpperCase() : ch);
        k.textContent = ch;
        rowEl.appendChild(k);
      });
      if (r === 2) rowEl.appendChild(makeKey('backspace', 'wide del', DEL_SVG));
      kbEl.appendChild(rowEl);
    });
    var bottom = el('div', 'row');
    bottom.appendChild(makeKey('-', 'dash', null)).textContent = '-';
    bottom.appendChild(makeKey(' ', 'space', null)).textContent = 'space';
    var ret = makeKey('enter', 'ret' + (state.checked ? ' next' : ''), null);
    ret.textContent = state.done ? 'Again' : (state.checked ? 'Next' : 'Check');
    bottom.appendChild(ret);
    kbEl.appendChild(bottom);
    kbEl.setAttribute('data-shift', state.shift ? 'on' : 'off');
    var shiftBtn = kbEl.querySelector('.shift');
    if (shiftBtn) shiftBtn.setAttribute('aria-pressed', state.shift ? 'true' : 'false');
  }

  function makeKey(code, cls, html) {
    var b = el('button', 'key ' + cls);
    b.type = 'button';
    b.setAttribute('data-code', code);
    if (html) b.innerHTML = html;
    var label = { shift: 'Shift', backspace: 'Delete', enter: 'Return', ' ': 'Space', '-': 'Hyphen' }[code] || code;
    b.setAttribute('aria-label', label);
    return b;
  }

  function pressKey(code) {
    if (code === 'shift') { state.shift = !state.shift; renderKeyboard(); return; }
    if (code === 'backspace') { backspace(); return; }
    if (code === 'enter') { if (state.done) { startRound(); } else { submit(); } return; }
    var ch = code;
    if (/[a-z]/.test(ch) && state.shift) { ch = ch.toUpperCase(); state.shift = false; renderKeyboard(); }
    typeChar(ch);
  }

  kbEl.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.key');
    if (!b) return;
    e.preventDefault();
    pressKey(b.getAttribute('data-code'));
  });
  kbEl.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Physical keyboard for desktop use
  document.addEventListener('keydown', function (e) {
    if (!$('sheetWrap').hidden) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
    else if (e.key === 'Enter') { e.preventDefault(); pressKey('enter'); }
    else if (e.key.length === 1 && /[a-z \-]/i.test(e.key)) { e.preventDefault(); typeChar(e.key); }
  });

  // ------------------------------------------------------------------
  // Level switch
  // ------------------------------------------------------------------
  function setLevel(level) {
    state.level = level;
    save(STORE_LEVEL, level);
    ['easy', 'medium', 'hard'].forEach(function (l) {
      $('lvl-' + l).setAttribute('aria-pressed', l === level ? 'true' : 'false');
    });
    startRound();
  }
  ['easy', 'medium', 'hard'].forEach(function (l) {
    $('lvl-' + l).addEventListener('click', function () { if (state.level !== l) setLevel(l); });
  });

  // ------------------------------------------------------------------
  // Deck sheet
  // ------------------------------------------------------------------
  var sheetWrap = $('sheetWrap'), deckText = $('deckText'), deckErr = $('deckErr');
  function openSheet() { deckText.value = state.deckText; deckErr.textContent = ''; sheetWrap.hidden = false; deckText.focus(); }
  function closeSheet() { sheetWrap.hidden = true; }
  $('deckBtn').addEventListener('click', openSheet);
  $('cancelDeck').addEventListener('click', closeSheet);
  sheetWrap.addEventListener('click', function (e) { if (e.target === sheetWrap) closeSheet(); });
  $('resetDeck').addEventListener('click', function () { deckText.value = SAMPLE; deckErr.textContent = ''; });
  $('saveDeck').addEventListener('click', function () {
    var parsed = parseDeck(deckText.value);
    if (parsed.errors.length) { deckErr.textContent = parsed.errors.slice(0, 3).join(' · '); return; }
    if (!parsed.cards.length) { deckErr.textContent = 'Add at least one plant.'; return; }
    state.deckText = deckText.value;
    if (deckText.value.trim() === SAMPLE.trim()) remove(STORE_DECK); else save(STORE_DECK, deckText.value);
    closeSheet();
    startRound();
  });

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  var savedDeck = load(STORE_DECK);
  if (savedDeck && parseDeck(savedDeck).cards.length) state.deckText = savedDeck;
  var savedLevel = load(STORE_LEVEL);
  if (savedLevel === 'medium' || savedLevel === 'hard') state.level = savedLevel;
  ['easy', 'medium', 'hard'].forEach(function (l) {
    $('lvl-' + l).setAttribute('aria-pressed', l === state.level ? 'true' : 'false');
  });
  startRound();
})();
</script>
</body>
</html>
